<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="referrer" content="no-referrer">
<meta name="app" content="cryptus-miniapp">
<title>Cryptus · Desk PAPER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">C</span>Cryptus <span class="paper">PAPER</span></div>
    <div class="live" id="live"><span class="dot wait" id="dot"></span><span id="livetxt">Connessione…</span></div>
  </header>
  <div class="deskline" id="deskline"></div>
  <div class="stickyhead">
    <div class="deskswitch" id="deskswitch" role="tablist" aria-label="Scegli il desk">
      <button type="button" data-d="meme" role="tab"><span class="dsn">Meme</span><span class="dsp"></span></button>
      <button type="button" data-d="major" role="tab"><span class="dsn">Major</span><span class="dsp"></span></button>
    </div>
    <div class="perf" id="perf" hidden></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <main id="view">
    <div class="card hero sk"><div class="skl w40"></div><div class="skl big"></div><div class="skl w60"></div><div class="skl chart"></div></div>
    <div class="card sk"><div class="skl w40"></div><div class="skl"></div><div class="skl"></div><div class="skl"></div></div>
  </main>
  <footer class="foot" id="foot">Solo paper trading · ogni portafoglio parte da €1.000 virtuali · nessun wallet, nessun ordine reale</footer>
</div>
<script src="app.js?v=14"></script>
</body>
</html>
